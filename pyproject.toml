[project]
name = "trialboard"
version = "0.1.0"
description = "Evidence-linked, verifiable clinical trial design multi-agent (dose optimization)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.13",
    "rdkit>=2024.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "openai>=1.40",
    "rank-bm25>=0.2",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
trialboard = "trialboard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"trialboard/cli.py" = ["B008", "E501"]
