[project]
name = "trialboard"
version = "0.1.0"
description = "Research prototype for source-linked dose-design review and synthetic simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pdfplumber>=0.11,<0.12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
trialboard = "trialboard.review.__main__:main"
trialboard-api = "trialboard.api.__main__:main"
trialboard-agent = "trialboard.agent.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
